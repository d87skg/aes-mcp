# AEF 语义约束定义文件
# 每个约束定义一个 AI Agent 必须遵守的规则
# 引擎会在每一步执行后检查这些约束是否仍然存在

constraints:
  - id: "max_leverage"
    description: "最大杠杆倍数不得超过 3x"
    category: "risk_management"
    check_type: "boundary"
    rule: "leverage <= 3"
    severity: "critical"
    auto_meltdown: true  # 违反时自动触发熔断

  - id: "max_position_size"
    description: "单笔头寸不得超过 5000 USDC"
    category: "risk_management"
    check_type: "boundary"
    rule: "amount <= 5000"
    severity: "critical"
    auto_meltdown: true

  - id: "stop_loss_required"
    description: "每笔交易必须设置止损"
    category: "risk_management"
    check_type: "presence"
    rule: "stop_loss is set"
    severity: "high"
    auto_meltdown: false

  - id: "no_aggressive_mode"
    description: "不得因聊天上下文中的无关内容改变风险偏好"
    category: "context_hygiene"
    check_type: "semantic"
    rule: "risk_profile == baseline"
    severity: "high"
    auto_meltdown: false

drift_categories:
  - name: "context_drift"
    description: "上下文窗口污染导致约束滑落"
  - name: "goal_drift"
    description: "Agent 目标函数发生偏移"
  - name: "tool_drift"
    description: "工具调用行为异常"
  - name: "constraint_drift"
    description: "显式约束从活跃集中消失"

detection:
  compare_window: 1  # 比较前 N 步的约束集
  min_severity_to_alert: "high"
  enable_causality_chain: true
